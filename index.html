<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HashBack Test</title>
<style>
 body{font-family:Arial,sans-serif;max-width:460px;margin:30px auto;padding:16px}
 label{display:block;margin-top:12px;font-size:13px;color:#555}
 input,button{width:100%;padding:12px;margin:4px 0;font-size:16px;box-sizing:border-box}
 button{background:#2563eb;color:#fff;border:0;border-radius:8px;margin-top:10px}
 button:disabled{background:#999}
 #out{margin-top:16px;padding:12px;background:#eee;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:13px}
</style></head><body>
<h2>HashBack Wallet B2C Test</h2>
<label>Backend URL</label>
<input id="api" value="https://payhero-callback-setup.onrender.com">
<label>API Key (the API_KEY in app.py)</label>
<input id="key" type="password">
<label>Phone</label><input id="phone" type="tel" placeholder="0712345678">
<label>Amount (KES)</label><input id="amount" type="number" value="10">
<label><input id="intl" type="checkbox" style="width:auto"> send as 2547... instead of 07...</label>
<button onclick="bal()">Check wallet balance</button>
<button onclick="wd()" id="wd">Withdraw</button>
<div id="out">Waiting...</div>
<script>
const out=document.getElementById("out"), btn=document.getElementById("wd");
const base=()=>document.getElementById("api").value.trim().replace(/\/$/,"");
const hdr=()=>({"Content-Type":"application/json","X-API-Key":document.getElementById("key").value.trim()});
async function call(path,body){
  out.textContent="Working... (the first request may take up to a minute)";
  try{
    const r=await fetch(base()+path,{method:"POST",headers:hdr(),body:JSON.stringify(body)});
    out.textContent="HTTP "+r.status+"\n\n"+JSON.stringify(await r.json(),null,2);
  }catch(e){out.textContent="Connection error: "+e.message;}
}
function bal(){call("/hb/balance",{});}
async function wd(){
  btn.disabled=true;
  await call("/hb/withdraw",{
    phone:document.getElementById("phone").value.trim(),
    amount:document.getElementById("amount").value,
    reference:"HB-"+Date.now(),
    intl:document.getElementById("intl").checked});
  setTimeout(()=>btn.disabled=false,5000);
}
</script>
</body>
</html>
